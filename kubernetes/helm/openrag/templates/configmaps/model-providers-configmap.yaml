{{- if and .Values.backend.enabled .Values.backend.modelProvidersConfig.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "openrag.fullname" . }}-model-providers
  namespace: {{ include "openrag.namespace" . }}
  labels:
    {{- include "openrag.labels" . | nindent 4 }}
data:
  model_providers.yaml: |
    {{- .Values.backend.modelProvidersConfig.content | nindent 4 }}
{{- end }}
